name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but let a running one finish so a partially
# uploaded site is never published.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The BLOB round-trip tests are the safety gate for this project; a build
      # that cannot re-serialise the sample save must never reach Pages.
      - name: Run tests
        run: npm test

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      # Vite needs the sub-path baked in at build time so assets resolve under
      # https://<user>.github.io/<repo>/. `base_path` is derived from the real
      # Pages URL, so this stays correct for user/org sites served from `/` too.
      - name: Build
        run: npm run build
        env:
          PZ_EDITOR_BASE: ${{ steps.pages.outputs.base_path }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
